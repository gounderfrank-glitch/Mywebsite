<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Orders - Frank's CNC</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background-image: url('images/wood_bg.jpg'); background-size: cover; background-attachment: fixed; background-position: center; color: #f0f0f0; }
        header { padding: 0; margin: 0; border-bottom: 4px solid #d4a017; background-color: #111; }
        .header-logo { width: 100%; max-width: 100%; height: auto; display: block; }
        
        nav { background-color: #333; padding: 15px 0; text-align: center; border-bottom: 1px solid #444; }
        .nav-link { color: #d4a017; text-decoration: none; font-size: 1.2em; margin: 0 20px; font-weight: bold; text-transform: uppercase; }
        .nav-link:hover { color: #fff; }
        .nav-link.active { color: #fff; border-bottom: 2px solid #fff; }

        .container { max-width: 800px; margin: 0 auto; padding: 20px; background-color: rgba(0,0,0,0.85); margin-top: 30px; border-radius: 10px; border: 1px solid #444; }
        .form-box { background-color: #222; padding: 40px; border-radius: 10px; border: 1px solid #444; margin-top: 20px; }
        
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; display: inline-block; border: 1px solid #555; border-radius: 4px; box-sizing: border-box; background-color: #333; color: white; font-family: inherit; }
        textarea { height: 120px; }
        fieldset { border: 1px solid #444; border-radius: 5px; padding: 20px; margin-bottom: 20px; }
        legend { color: #d4a017; font-weight: bold; padding: 0 10px; }
        .btn { background-color: #d4a017; color: black; padding: 15px 30px; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; font-size: 1.1em; }
        .btn:hover { background-color: #fff; }
    </style>
</head>
<body>
    <header>
        <img src="images/header_logo.jpg" alt="Frank Harley Custom Woodworking" class="header-logo">
        <nav>
            <a href="index.html" class="nav-link">Home</a>
            <a href="gallery.html" class="nav-link">Gallery</a>
            <a href="custom.html" class="nav-link active">Custom Orders</a>
            <a href="shop.html" class="nav-link">Shop Plans</a>
        </nav>
    </header>

    <div class="container">
        <div class="form-box">
            <p style="text-align: center; font-size: 1.1em; margin-bottom: 20px;">Fill out the details below. I will review your specs and email you a price quote.</p>
            
            <form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST">
                <fieldset>
                    <legend>Step 1: Project Type</legend>
                    <select name="project-type" required>
                        <option value="">-- Choose Item Type --</option>
                        <option value="Custom Sign">Custom Sign / V-Carve</option>
                        <option value="Furniture">Flatpack Furniture</option>
                        <option value="Accessories">Accessories</option>
                        <option value="3D Carve">3D Relief Carving</option>
                    </select>
                </fieldset>
                <fieldset>
                    <legend>Step 2: Material & Size</legend>
                    <select name="material" required>
                        <option value="">-- Choose Material --</option>
                        <option value="Maple">Maple</option>
                        <option value="Ash">Ash</option>
                        <option value="Pine">Pine</option>
                        <option value="Plastic">Plastic / Acrylic</option>
                        <option value="Foam">Sign Foam</option>
                    </select>
                    <input type="text" name="dimensions" placeholder="Approx. Dimensions (e.g. 24x24 inch)" required>
                </fieldset>
                <fieldset>
                    <legend>Step 3: Contact & Details</legend>
                    <textarea name="details" placeholder="Describe your idea..." required></textarea>
                    <input type="text" name="name" placeholder="Your Name" required>
                    <input type="email" name="email" placeholder="Your Email" required>
                    <input type="tel" name="phone" placeholder="Phone Number">
                </fieldset>
                <button type="submit" class="btn">Submit Request</button>
            </form>
        </div>
    </div>
</body>
</html>
