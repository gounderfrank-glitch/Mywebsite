<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Frank Harley Custom Woodworking</title>
    <style>
        /* --- RESET & BASICS --- */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a; /* Dark charcoal background */
            color: #e0e0e0; /* Light text */
        }

        /* --- HEADER IMAGE --- */
        header img {
            width: 100%;
            height: auto;
            display: block;
            border-bottom: 4px solid #cda434; /* Gold border below header */
        }

        /* --- NAVIGATION --- */
        nav {
            background-color: #000;
            text-align: center;
            padding: 15px 0;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 25px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #cda434; /* Gold glow on hover */
        }

        /* --- PAGE TITLE --- */
        .page-title {
            text-align: center;
            margin: 40px 0 20px;
            color: #cda434;
            font-size: 2em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- GALLERY GRID --- */
        .gallery-container {
            max-width: 1200px;
            margin: 0 auto 60px; /* Centered with bottom spacing */
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .gallery-item {
            position: relative;
            background-color: #000;
            border: 1px solid #333;
            overflow: hidden; /* Keeps image inside border */
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px); /* Lifts up slightly */
            border-color: #cda434; /* Gold border on hover */
        }

        .gallery-item img {
            width: 100%;
            height: 300px; /* Forces uniform height */
            object-fit: cover; /* Crops image to fit nicely without stretching */
            display: block;
            opacity: 0.9;
            transition: opacity 0.3s;
        }

        .gallery-item:hover img {
            opacity: 1; /* Brightens on hover */
        }

        .gallery-caption {
            padding: 15px;
            text-align: center;
            background-color: #111;
            color: #cda434;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 20px;
            background-color: #000;
            color: #666;
            font-size: 0.8rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <img src="header.jpg" alt="Frank Harley Custom Woodworking Header">
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>

    <h1 class="page-title">Current Projects</h1>

    <div class="gallery-container">

        <div class="gallery-item">
            <img src="jack.jpg" alt="Jack Project">
            <div class="gallery-caption">Custom "Jack" Piece</div>
        </div>

        <div class="gallery-item">
            <img src="live1.jpg" alt="Live Edge Table 1">
            <div class="gallery-caption">Live Edge Slab 01</div>
        </div>

        <div class="gallery-item">
            <img src="live2.jpg" alt="Live Edge Table 2">
            <div class="gallery-caption">Live Edge Slab 02</div>
        </div>

        <div class="gallery-item">
            <img src="punisher.jpg" alt="Punisher Logo Woodwork">
            <div class="gallery-caption">The Punisher Theme</div>
        </div>

    </div>

    <footer>
        &copy; 2024 Frank Harley Custom Woodworking
    </footer>

</body>
</html>
