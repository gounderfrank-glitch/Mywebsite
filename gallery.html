<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Frank's CNC</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background-image: url('images/wood_bg.jpg'); background-size: cover; background-attachment: fixed; background-position: center; color: #f0f0f0; }
        header { padding: 0; margin: 0; border-bottom: 4px solid #d4a017; background-color: #111; }
        .header-logo { width: 100%; max-width: 100%; height: auto; display: block; }
        
        nav { background-color: #333; padding: 15px 0; text-align: center; border-bottom: 1px solid #444; }
        .nav-link { color: #d4a017; text-decoration: none; font-size: 1.2em; margin: 0 20px; font-weight: bold; text-transform: uppercase; }
        .nav-link:hover { color: #fff; }
        .nav-link.active { color: #fff; border-bottom: 2px solid #fff; }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; background-color: rgba(0,0,0,0.85); margin-top: 30px; border-radius: 10px; border: 1px solid #444; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        
        .gallery-item { background: #333; padding: 10px; border-radius: 8px; border: 1px solid #555; text-align: center; }
        .gallery-item img { width: 100%; height: 250px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; }
        h3 { margin: 10px 0 5px 0; color: #fff; }
        p { color: #ccc; font-size: 0.9em; }
    </style>
</head>
<body>
    <header>
        <img src="images/header_logo.jpg" alt="Frank Harley Custom Woodworking" class="header-logo">
        <nav>
            <a href="index.html" class="nav-link">Home</a>
            <a href="gallery.html" class="nav-link active">Gallery</a>
            <a href="custom.html" class="nav-link">Custom Orders</a>
            <a href="shop.html" class="nav-link">Shop Plans</a>
        </nav>
    </header>

    <div class="container">
        <h2 style="text-align:center; text-transform: uppercase; letter-spacing: 1px; color:#d4a017;">Past Projects Showcase</h2>
        
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="images/flag.jpg" alt="Carved Flag">
                <h3>3D Carved Flags</h3>
                <p>High-relief texture and precision stars.</p>
            </div>
            <div class="gallery-item">
                <img src="images/indiana.jpg" alt="State Sign">
                <h3>Custom State Signs</h3>
                <p>Layered designs for home decor.</p>
            </div>
            <div class="gallery-item">
                <img src="images/sign_custom.jpg" alt="Custom Text Sign">
                <h3>Business & Commercial</h3>
                <p>Unique signage for local businesses.</p>
            </div>
            <div class="gallery-item">
                <img src="images/beer.jpg" alt="Novelty Sign">
                <h3>Novelty & Gifts</h3>
                <p>Fun, custom gifts for any occasion.</p>
            </div>
        </div>
    </div>
</body>
</html>
