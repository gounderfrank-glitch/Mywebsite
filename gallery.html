<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Frank Harley Custom Woodworking</title>
    <style>
        /* --- RESET & BASICS --- */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a; 
            color: #e0e0e0;
        }

        /* --- HEADER --- */
        header img {
            width: 100%;
            height: auto;
            display: block;
            border-bottom: 4px solid #cda434;
        }

        /* --- NAVIGATION --- */
        nav {
            background-color: #000;
            text-align: center;
            padding: 15px 0;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 25px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #cda434;
        }

        /* --- PAGE TITLE --- */
        .page-title {
            text-align: center;
            margin: 40px 0 20px;
            color: #cda434;
            font-size: 2em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- GALLERY GRID --- */
        .gallery-container {
            max-width: 1200px;
            margin: 0 auto 60px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .gallery-item {
            position: relative;
            background-color: #000;
            border: 1px solid #333;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            border-color: #cda434;
        }

        .gallery-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            opacity: 0.9;
            transition: opacity 0.3s;
        }

        .gallery-item:hover img {
            opacity: 1;
        }

        .gallery-caption {
            padding: 15px;
            text-align: center;
            background-color: #111;
            color: #cda434;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 1rem;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #000;
            color: #666;
            font-size: 0.8rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <img src="images/header.jpg" alt="header">
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>

    <h1 class="page-title">Current Projects</h1>

    <div class="gallery-container">

        <div class="gallery-item">
            <img src="images/live2.jpg" alt="live2">
            <div class="gallery-caption">live2</div>
        </div>

        <div class="gallery-item">
            <img src="images/jack.jpg" alt="jack">
            <div class="gallery-caption">jack</div>
        </div>

        <div class="gallery-item">
            <img src="images/live1.jpg" alt="live1">
            <div class="gallery-caption">live1</div>
        </div>

        <div class="gallery-item">
            <img src="images/home.jpg" alt="home">
            <div class="gallery-caption">home</div>
        </div>

        <div class="gallery-item">
            <img src="images/family.jpg" alt="family">
            <div class="gallery-caption">family</div>
        </div>

        <div class="gallery-item">
            <img src="images/beds.jpg" alt="beds">
            <div class="gallery-caption">beds</div>
        </div>

        <div class="gallery-item">
            <img src="images/shelf.jpg" alt="shelf">
            <div class="gallery-caption">shelf</div>
        </div>

        <div class="gallery-item">
            <img src="images/punisher.jpg" alt="punisher">
            <div class="gallery-caption">punisher</div>
        </div>

    </div>

    <footer>
        &copy; 2024 Frank Harley Custom Woodworking
    </footer>

</body>
</html>
