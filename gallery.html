<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Gallery - Frank's CNC</title>
    <style>
        /* --- BASIC PAGE SETUP --- */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4; /* Light grey background */
        }

        /* --- NAVIGATION (Matches your screenshot) --- */
        nav {
            background-color: #333;
            text-align: center;
            padding: 15px 0;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
            font-size: 18px;
        }
        nav a:hover {
            color: #daa520; /* Gold color on hover */
        }

        /* --- GALLERY GRID STYLES --- */
        .gallery-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            /* This creates columns automatically. Minimum width 300px, otherwise it wraps. */
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .gallery-item {
            background-color: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.2s; /* Smooth zoom effect */
        }

        .gallery-item:hover {
            transform: scale(1.02); /* Slight zoom when mouse hovers */
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }

        .gallery-caption {
            margin-top: 10px;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">HOME</a>
        <a href="gallery.html">GALLERY</a>
    </nav>

    <div class="gallery-container">
        
        <div class="gallery-item">
            <img src="jack.jpg" alt="Jack Project">
            <div class="gallery-caption">Jack Project</div>
        </div>

        <div class="gallery-item">
            <img src="live1.jpg" alt="Live Edge Project 1">
            <div class="gallery-caption">Live Edge Work 1</div>
        </div>

        <div class="gallery-item">
            <img src="live2.jpg" alt="Live Edge Project 2">
            <div class="gallery-caption">Live Edge Work 2</div>
        </div>

        <div class="gallery-item">
            <img src="punisher.jpg" alt="Punisher Project">
            <div class="gallery-caption">The Punisher</div>
        </div>

    </div>

</body>
</html>
