<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Gallery - Frank's CNC</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('images/wood_bg.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: #f0f0f0; 
        }

        header {
            padding: 0;
            margin: 0;
            border-bottom: 4px solid #d4a017;
            background-color: #111;
        }
        
        .header-logo {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
        }
        
        nav { 
            background-color: #333; 
            padding: 15px 0; 
            text-align: center;
            border-bottom: 1px solid #444;
        }
        .nav-link { color: #d4a017; text-decoration: none; font-size: 1.2em; margin: 0 20px; font-weight: bold; text-transform: uppercase; }
        .nav-link:hover { color: #fff; }
        .nav-link.active { color: #fff; border-bottom: 2px solid #fff; }

        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 30px; 
            background-color: rgba(0, 0, 0, 0.85); 
            margin-top: 30px;
            border-radius: 10px;
            border: 1px solid #444;
        }
        
        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            margin-top: 30px; 
        }
        
        .gallery-item {
            background: #333;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #555;
            text-align: center;
            transition: transform 0.3s;
        }
        .gallery-item:hover { transform: scale(1.02); border-color: #d4a017; }
        
        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        
        h2 { border-bottom: 2px solid #555; padding-bottom: 10px; margin-top: 0; color: #d4a017; text-transform: uppercase; letter-spacing: 1px; }
        h3 { margin: 10px 0 5px 0; color: #fff; font-size: 1.2em; }
        p { color: #ccc; font-size: 0.9em; }
        
        .cta-box { text-align: center; margin-top: 50px; padding-top: 30px; border-top: 1px solid #555; }
        .btn { 
            background-color: #d4a017; color: black; padding: 15px 30px; 
            text-decoration: none; font-weight: bold; border-radius: 5px; 
            display: inline-block; font-size: 1.1em; 
        }
        .btn:hover { background-color: #fff; }
    </style>
</head>
<body>
    <header>
        <img src="images/header_logo.jpg" alt="Frank Harley Custom Woodworking" class="header-logo">
        <nav>
            <a href="index.html" class="nav-link">Home</a>
            <a href="gallery.html" class="nav-link active">Gallery</a>
            <a href="custom.html" class="nav-link">Custom Orders</a>
            <a href="shop.html" class="nav-link">Shop Plans</a>
        </nav>
    </header>

    <div class="container">
        <h2>Past Projects & Custom Work</h2>
