<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Frank Harley Custom Woodworking</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; color: #e0e0e0; }
        
        /* HEADER - Updated to include Top Border */
        header img { 
            width: 100%; 
            height: auto; 
            display: block; 
            border-top: 4px solid #cda434;    /* Gold Border at TOP */
            border-bottom: 4px solid #cda434; /* Keeping Bottom for symmetry (remove if you only want top) */
        }
        
        /* NAV */
        nav { background-color: #333; text-align: center; padding: 15px 0; border-bottom: 2px solid #cda434; }
        nav a { color: #cda434; text-decoration: none; margin: 0 20px; font-size: 18px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; transition: color 0.3s; }
        nav a:hover { color: #fff; }
        nav a.active-page { color: #fff; text-decoration: underline; }
        
        /* CONTENT */
        .hero-section { text-align: center; padding: 60px 20px; }
        h1 { color: #cda434; font-size: 2.5em; text-transform: uppercase; letter-spacing: 2px; }
        p.intro { max-width: 800px; margin: 0 auto; font-size: 1.2em; line-height: 1.6; color: #ccc; }
        .btn { display: inline-block; background-color: #cda434; color: #000; padding: 15px 30px; margin-top: 30px; text-decoration: none; font-weight: bold; border-radius: 4px; text-transform: uppercase; }
        .btn:hover { background-color: #fff; }
        
        /* FOOTER - Updated Styles */
        footer { text-align: center; padding: 30px; background-color: #000; color: #666; margin-top: 50px; border-top: 1px solid #333; }
        .contact-info { color: #cda434; font-weight: bold; margin-bottom: 10px; font-size: 1.1em; }
        .contact-info span { margin: 0 10px; color: #fff; } /* Separator style */
    </style>
</head>
<body>

    <header><img src="images/header_logo.jpg" alt="Frank Harley Custom Woodworking"></header>

    <nav>
        <a href="index.html" class="active-page">HOME</a>
        <a href="gallery.html">GALLERY</a>
        <a href="custom.html">CUSTOM</a>
        <a href="shop.html">SHOP</a>
    </nav>

    <div class="hero-section">
        <h1>Handcrafted Custom Woodworking</h1>
        <p class="intro">Quality craftsmanship for your home and business. From live edge tables to custom signs, we build unique pieces that last a lifetime.</p>
        <br>
        <a href="gallery.html" class="btn">View Our Work</a>
    </div>

    <footer>
        <div class="contact-info">
            Phone: (555) 123-4567 <span>|</span> Email: frank@example.com
        </div>
        &copy; 2024 Frank Harley Custom Woodworking
    </footer>

</body>
</html>
