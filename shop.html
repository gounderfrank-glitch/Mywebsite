<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Plans - Frank Harley Custom Woodworking</title>
    <style>
        /* --- GLOBAL STYLES --- */
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; color: #e0e0e0; }

        /* --- HEADER & NAV --- */
        header img { width: 100%; height: auto; display: block; border-bottom: 4px solid #cda434; }
        nav { background-color: #333; text-align: center; padding: 15px 0; border-bottom: 2px solid #cda434; }
        nav a { color: #cda434; text-decoration: none; margin: 0 20px; font-size: 18px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; transition: color 0.3s; }
        nav a:hover { color: #fff; }
        nav a.active-page { color: #fff; text-decoration: underline; }

        /* --- PLANS LAYOUT --- */
        h1.page-title { text-align: center; margin: 40px 0 20px; color: #cda434; font-size: 2em; text-transform: uppercase; letter-spacing: 2px; }
        .plans-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; }
        .plan-card { background-color: #000; padding: 20px; border: 1px solid #333; text-align: center; }
        .plan-title { color: #fff; font-size: 1.5em; margin-bottom: 10px; }
        .plan-price { color: #cda434; font-size: 1.2em; font-weight: bold; margin-bottom: 20px; display: block; }
        .buy-btn { background-color: #cda434; color: #000; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 4px; display: inline-block; }
        .buy-btn:hover { background-color: #fff; }

        footer { text-align: center; padding: 20px; background-color: #000; color: #666; margin-top: 50px; }
    </style>
</head>
<body>

    <header><img src="images/header.jpg" alt="Frank Harley Custom Woodworking"></header>

    <nav>
        <a href="index.html">HOME</a>
        <a href="gallery.html">GALLERY</a>
        <a href="custom.html">CUSTOM ORDERS</a>
        <a href="shop.html" class="active-page">SHOP PLANS</a>
    </nav>

    <h1 class="page-title">Digital Shop Plans</h1>

    <div class="plans-container">
        <div class="plan-card">
            <div class="plan-title">Basic Table Plan</div>
            <span class="plan-price">$10.00</span>
            <br>
            <a href="#" class="buy-btn">Buy Now</a>
        </div>
        
        <div class="plan-card">
            <div class="plan-title">CNC Sign Template</div>
            <span class="plan-price">$15.00</span>
            <br>
            <a href="#" class="buy-btn">Buy Now</a>
        </div>

        <div class="plan-card">
            <div class="plan-title">Bed Frame Blueprints</div>
            <span class="plan-price">$25.00</span>
            <br>
            <a href="#" class="buy-btn">Buy Now</a>
        </div>
    </div>

    <footer>&copy; 2024 Frank Harley Custom Woodworking</footer>
</body>
</html>
